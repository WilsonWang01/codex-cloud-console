name: Bug report
description: Report a reproducible problem without sharing production data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account IDs, public IPs, absolute private paths, or conversation content.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: textarea
    id: verification
    attributes:
      label: Verification output
      description: Include only sanitized output.
