name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Verify production CLI Linux command boundaries
        run: npx --yes --package=@openai/codex@0.165.0 -c 'CODEX_SCHEMA_CLI_BINARY="$(command -v codex)" npm run verify:command-isolation:codex'
      - run: npm run verify:local
      - run: npm run verify:chat-reading:ui
      - run: npm run verify:personal-memory:quality
      - run: npm run verify:command-isolation:codex -- --catalog-only
      - run: npm run verify:mail-drafts:quality
      - run: npm run verify:mail:ui
      - run: npm run verify:calendar:ui
      - run: npm run verify:mail-drafts:codex
      - run: npm run verify:external-client:codex -- --guards-only
      - run: npm run verify:external-client:codex -- --faults-only
      - name: Verify production CLI in-flight cancellation and restart
        env:
          CODEX_SCHEMA_CLI_VERSION: 0.165.0
        run: npx --yes --package=@openai/codex@0.165.0 -c 'CODEX_SCHEMA_CLI_BINARY="$(command -v codex)" npm run verify:external-client:codex -- --faults-only'
      - run: npm run verify:personal-results:quality
      - run: npm run verify:runtime
