name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:local
      - run: npm run verify:personal-memory:quality
      - run: npm run verify:external-client:codex -- --guards-only
      - run: npm run verify:external-client:codex -- --faults-only
      - run: npm run verify:runtime
