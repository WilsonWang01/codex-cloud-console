name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Configure temporary runner bwrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor-profiles
          dpkg-query -W -f='${Package} ${Version}\n' bubblewrap apparmor-profiles
          bwrap --version
          sha256sum /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo grep -F bwrap /sys/kernel/security/apparmor/profiles
      - name: Verify production CLI Linux command boundaries
        run: npx --yes --package=@openai/codex@0.165.0 -c 'CODEX_SCHEMA_CLI_BINARY="$(command -v codex)" npm run verify:command-isolation:codex'
      - name: Verify current CLI material delivery and restart (no model)
        env:
          CODEX_SCHEMA_CLI_VERSION: 0.165.0
        run: npx --yes --package=@openai/codex@0.165.0 -c 'CODEX_SCHEMA_CLI_BINARY="$(command -v codex)" npm run verify:external-client:codex'
      - run: npm run verify:local
      - run: npm run verify:chat-reading:ui
      - run: npm run verify:personal-memory:quality
      - run: npm run verify:command-isolation:codex -- --catalog-only
      - run: npm run verify:mail-drafts:quality
      - run: npm run verify:mail:ui
      - run: npm run verify:calendar:ui
      - run: npm run verify:personal-calendar-actions:ui
        env:
          CODEX_CALENDAR_UI_OUTPUT: ${{ runner.temp }}/calendar-actions
      - run: node scripts/verify-personal-calendar-actions-ui.mjs --model-proposals
        env:
          CODEX_CALENDAR_UI_OUTPUT: ${{ runner.temp }}/calendar-proposals
      - run: npm run verify:mail-drafts:codex
      - run: npm run verify:personal-calendar:codex
      - run: npm run verify:external-client:codex -- --guards-only
      - run: npm run verify:external-client:codex -- --faults-only
      - name: Verify production CLI in-flight cancellation and restart
        env:
          CODEX_SCHEMA_CLI_VERSION: 0.165.0
        run: npx --yes --package=@openai/codex@0.165.0 -c 'CODEX_SCHEMA_CLI_BINARY="$(command -v codex)" npm run verify:external-client:codex -- --faults-only'
      - name: Codex 0.165 MCP readback (no model)
        run: >-
          npx --yes --package=@openai/codex@0.165.0 -c
          'CODEX_MCP_NATIVE_CLI_BINARY="$(command -v codex)"
          CODEX_CLOUD_REGRESSION_CASE="independent clients retrieve private exact-turn files and images after native history and process restart"
          node scripts/verify-regressions.mjs'
      - run: npm run verify:personal-results:quality
      - run: npm run verify:runtime
